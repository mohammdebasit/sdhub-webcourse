<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="h-[100vh] w-full flex justify-center items-center">
    <main class="m-3 w-fit  shadow-2xl rounded-2xl bg-[#ffffde]">
        <section class=" bg-[#fff1d4] rounded-t-2xl">
            <div class="h-28"></div>
            <input type="text" id="num" readonly class="h-20 w-80 outline-none text-right text-3xl font-bold" />
        </section>
        <hr />
        <section class="m-3 flex items-center gap-1.5">
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">AC</button>
            <button id="btn"
                class= " w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]"><img
                    src="delete.png"></button>
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">%</button>
            <button
                class="w-18 rounded-2xl  bg-[#f2ae61] p-5 text-2xl font-bold hover:bg-[#db8c32] active:bg-[#c47a24]">/</button>
        </section>
        <section class="m-3 flex items-center gap-1.5">
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">7</button>
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">8</button>
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">9</button>
            <button
                class="w-18 rounded-2xl  bg-[#f2ae61] p-5 text-2xl font-bold hover:bg-[#db8c32] active:bg-[#c47a24]">*</button>
        </section>
        <section class="m-3 flex items-center gap-1.5">
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">4</button>
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">5</button>
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">6</button>
            <button
                class="w-18 rounded-2xl  bg-[#f2ae61] p-5 text-2xl font-bold hover:bg-[#db8c32] active:bg-[#c47a24]">-</button>
        </section>
        <section class="m-3 flex items-center gap-1.5">
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">1</button>
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">2</button>
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">3</button>
            <button
                class="w-18 rounded-2xl  bg-[#f2ae61] p-5 text-2xl font-bold hover:bg-[#db8c32] active:bg-[#c47a24]">+</button>
        </section>
        <section class="m-3 flex items-center gap-1.5">
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">00</button>
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">0</button>
            <button
                class="w-18 rounded-2xl  bg-[#ffe4ab] p-5 text-2xl font-bold hover:bg-[#ffd37a] active:bg-[#ffc864]">.</button>
            <button
                class="w-18 rounded-2xl  bg-[#f2ae61] p-5 text-2xl font-bold hover:bg-[#db8c32] active:bg-[#c47a24]">=</button>
        </section>
    </main>


    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        .box {
            position: relative;
            border: 2px solid black;
            border-radius: 8px;
            width: 350px;
            height: 500px;
            padding: 5px;
        }

        .img {
            padding:2px;

        }

        img {
            border-radius: 8px;
        }

        span {
            padding: 4px 6px 4px 6px;
            margin: 0px 8px 0px 0px;
            border: 2px solid gray;
            border-radius: 64px;
            display: inline-flex;
        }

        .sp {
            display: block;
            margin: 6px;
        }

        h2 {
            padding: 5px;
        }

        p {
            padding: 1px 4px 1px 6px;
            line-height: 1.5;
        }

        pre {
            position: absolute;
            bottom: 40px;
            font-weight: bolder;
            font-size: large;
            margin-left: 6px;
        }

        button{
            padding: 9px;
            border-radius: 64px;
            border-style: none;
            background-color: rgb(179, 237, 237);
        }
        .bb{
            position: absolute;
            display: flex;
            bottom: 10px;
            right: 10px;
        }
        .n{
            font-size: 23px;
            position: absolute;
            bottom: 10px;
            margin-left: 6px;
        }
    </style>
</head>

<body>
    <div class="box">

        <div class="img">
            <img width="346" height="220" src="im.webp" alt="image">
        </div>

        <h2>Lorem, ipsum dolor.</h2>
        <div class="sp">
            <span>Nature</span>
            <span>stressfree life</span>
        </div>

        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Quisquam quis fugit, voluptas, cum ipsam, sunt
            facilis commodi quas corporis accusantium exercitationem quod voluptatum.</p>
        <pre>Prize</pre>
        <div class="n">

            <big><b>$123.8</b></big>
        </div>
            <div class="bb">
            <button>Add to card</button>
        </div>
    </div>
</body>

</html>

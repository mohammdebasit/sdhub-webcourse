<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gradient-to-r from-[#F7F1E5] to-gray-200 flex justify-center items-center">
  <div class="flex w-fit flex-col gap-4 p-5 bg-[#F2F2F2] rounded-3xl shadow-lg min-h-80 text-[#3A3A3A]">
    <div class="flex gap-2 text-center text-3xl font-medium mx-4">Todo List <img src="checklist.png" alt="image"
        class="w-8" />
    </div>

    <div class="flex flex-col gap-3.5 ">
      <div class=" bg-gray-200 rounded-3xl w-2xl ">
        <input type="text" id="input" placeholder="Enter your todo" class=" w-142.5 rounded-2xl p-4 outline-none" />
        <button id="add-btn" onclick="addfunction()"
          class="w-24 rounded-3xl bg-gray-300 p-4 hover:bg-gray-400 active:p-3 font-medium cursor-pointer">Add</button>
      </div>
      <ul id="todo-list">
        <li id="todos" class=" flex justify-between text-lg mx-4 my-1 hidden ">
          <div class="cursor-pointer flex gap-2 items-center"><input type="checkbox" class="w-4 h-4 cursor-pointer" />
            <p class="text-lg ">to do</p></div>
          <button onclick="dele(this)" class=""><img src="trash-bin.png" alt="image" class="w-6 active:w-4 cursor-pointer" /></button>
        </li>
      </ul>
    </div>
  </div>


  <script src="script.js"></script>
</body>

</html>
